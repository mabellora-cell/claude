<title>Split Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@400;600&display=swap">
<style>
:root {
  --paper:#f7f8f4; --surface:#ffffff; --surface-2:#f1f3ee;
  --ink:#1b2420; --ink-2:#4a564f; --ink-3:#78857c;
  --rule:#dee4dc; --rule-2:#eceee9;
  --shared:#1f6f52; --shared-bg:#e6f0ea; --shared-ink:#155840;
  --mine:#4a5a8f; --mine-bg:#e8eaf3; --mine-ink:#3a4775;
  --his:#7d3f6b; --his-bg:#f2e7ef; --his-ink:#652f56;
  --skip:#6f7a73; --skip-bg:#ecefec; --skip-ink:#55605a;
  --review:#a8760b; --review-bg:#fbf1dc; --review-ink:#7d5806;
  --focus:#1f6f52; --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(27,36,32,.06), 0 8px 24px -12px rgba(27,36,32,.18);
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Spectral",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121613; --surface:#1a201c; --surface-2:#212823;
    --ink:#e8ede9; --ink-2:#a9b5ae; --ink-3:#7f8b84;
    --rule:#2b332d; --rule-2:#232a25;
    --shared:#5cbf95; --shared-bg:#163026; --shared-ink:#7fd3ad;
    --mine:#93a3d8; --mine-bg:#1e2438; --mine-ink:#aab7e4;
    --his:#d094c0; --his-bg:#2e1f2a; --his-ink:#e0aed3;
    --skip:#8b968f; --skip-bg:#242a26; --skip-ink:#9aa59e;
    --review:#e0a94a; --review-bg:#332714; --review-ink:#eabd6f;
    --focus:#5cbf95; --on-accent:#0f1a15;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#121613; --surface:#1a201c; --surface-2:#212823;
  --ink:#e8ede9; --ink-2:#a9b5ae; --ink-3:#7f8b84;
  --rule:#2b332d; --rule-2:#232a25;
  --shared:#5cbf95; --shared-bg:#163026; --shared-ink:#7fd3ad;
  --mine:#93a3d8; --mine-bg:#1e2438; --mine-ink:#aab7e4;
  --his:#d094c0; --his-bg:#2e1f2a; --his-ink:#e0aed3;
  --skip:#8b968f; --skip-bg:#242a26; --skip-ink:#9aa59e;
  --review:#e0a94a; --review-bg:#332714; --review-ink:#eabd6f;
  --focus:#5cbf95; --on-accent:#0f1a15;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:64px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- masthead ---------- */
.masthead{padding:36px 0 20px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.15;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.sample-note{margin:16px 0 0;padding:10px 14px;border-left:3px solid var(--review);
  background:var(--review-bg);color:var(--review-ink);border-radius:0 6px 6px 0;font-size:13.5px}

/* ---------- settlement ---------- */
.settle{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);margin-top:20px}
.settle-inner{max-width:1080px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:baseline;gap:28px;flex-wrap:wrap}
.settle-figure{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.settle-amount{font-family:var(--display);font-size:32px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.settle-label{font-size:13px;color:var(--ink-2);max-width:26ch;line-height:1.3}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat-v{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.stat-v.warn{color:var(--review)}

/* ---------- filters ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:18px 0 12px}
.chip{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--surface);
  color:var(--ink-2);border-radius:999px;padding:5px 13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--mono);font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.bar-sep{flex:1}
.linkbtn{font:inherit;font-size:13px;background:none;border:none;color:var(--ink-2);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:5px 4px}
.linkbtn:hover{color:var(--ink)}

/* ---------- ledger ---------- */
.group-head{display:flex;align-items:center;gap:10px;padding:22px 0 8px}
.group-head h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0}
.group-head .rule{flex:1;height:1px;background:var(--rule)}
.group-head .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.ledger{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 86px 1fr auto auto;gap:14px;align-items:start;
  padding:12px 16px;border-top:1px solid var(--rule-2)}
.row:first-child{border-top:none}
.row.is-review{background:linear-gradient(90deg,var(--review-bg),transparent 45%)}
.row-date{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:5px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.row-main{min-width:0;padding-top:2px}
.row-desc{font-weight:500;overflow-wrap:anywhere}
.row-raw{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px;overflow-wrap:anywhere}
.row-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-3)}
.tag.rule{text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;background:none;
  color:var(--ink-3);padding:2px 0;font-style:italic}
.row-amt{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
  text-align:right;padding-top:4px;white-space:nowrap}
.row-amt.refund{color:var(--shared)}
.row-owed{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;
  text-align:right;padding-top:5px;white-space:nowrap;color:var(--ink-3);min-width:74px}
.row-owed.on{color:var(--shared);font-weight:500}
.row-owed.all-his{color:var(--his);font-weight:600}

/* ---------- segmented control ---------- */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--surface-2)}
.seg button{font:inherit;font-size:12px;font-weight:500;border:none;background:none;color:var(--ink-3);
  padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  border-right:1px solid var(--rule);transition:background .12s,color .12s}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--ink);background:var(--surface)}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.seg button.v-shared[aria-pressed="true"]{background:var(--shared);color:var(--on-accent)}
.seg button.v-personal[aria-pressed="true"]{background:var(--mine);color:var(--on-accent)}
.seg button.v-his[aria-pressed="true"]{background:var(--his);color:var(--on-accent)}
.seg button.v-excluded[aria-pressed="true"]{background:var(--skip);color:var(--on-accent)}
.seg .tick{width:12px;display:inline-block;text-align:center}
.seg.compact button{padding:3px 8px;font-size:11.5px}

/* ---------- misc ---------- */
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.saving{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:40;
  background:var(--ink);color:var(--paper);font-size:12.5px;padding:7px 15px;border-radius:999px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s}
.saving.show{opacity:1}
.saving.warn{background:var(--review);color:#fff}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--rule);
  color:var(--ink-3);font-size:12.5px;max-width:70ch}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:760px){
  .row{grid-template-columns:1fr auto;gap:8px}
  .row-date{grid-row:1;grid-column:1;padding-top:0}
  .row-amt{grid-row:1;grid-column:2;padding-top:0}
  .row-main{grid-row:2;grid-column:1/3}
  .row .seg{grid-row:3;grid-column:1}
  .row-owed{grid-row:3;grid-column:2;text-align:right;padding-top:6px}
  .settle-amount{font-size:26px}
  h1{font-size:27px}
}
</style>
<style>
/* ---------- view switch + month tabs ---------- */
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--rule);
  border-radius:8px;padding:2px}
.tabs button{font:inherit;font-size:13px;font-weight:500;border:none;background:none;
  color:var(--ink-3);padding:5px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.07)}
.tabs button:hover{color:var(--ink)}
.months{display:flex;gap:6px}
.months button{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--surface);
  color:var(--ink-2);border-radius:999px;padding:4px 12px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 0 4px}
.toolbar .spacer{flex:1}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--shared);border-color:var(--shared);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}

/* ---------- settlement view ---------- */
.settlement{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:28px;
  align-items:start;padding-top:8px}
@media (max-width:860px){.settlement{grid-template-columns:1fr}}
.headline{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:24px 26px}
.headline .who{font-size:13px;color:var(--ink-2);letter-spacing:.01em}
.headline .amt{font-family:var(--display);font-size:52px;font-weight:600;line-height:1.05;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.headline .amt.settled{color:var(--shared)}
.headline .cav{font-size:13px;color:var(--review);margin-top:8px}
.calc{margin-top:20px;width:100%;border-collapse:collapse;font-size:14px}
.calc td{padding:7px 0;border-bottom:1px solid var(--rule-2)}
.calc td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.calc tr:last-child td{border-bottom:none;padding-top:12px;font-weight:600;font-size:15.5px}
.calc tr:last-child td:last-child{color:var(--shared)}
.calc .sub td{color:var(--ink-2);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px 22px}
.panel h3{font-family:var(--display);font-size:15px;font-weight:600;margin:0 0 12px}
.cat{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.cat .nm{min-width:0;overflow-wrap:anywhere}
.cat .meter{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:28px}
.cat .meter i{display:block;height:100%;background:var(--shared);border-radius:3px}
.cat .vl{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;
  color:var(--ink-2);white-space:nowrap}
.lines{margin-top:24px}
.lines h3{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 10px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table.lines-t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.lines-t th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--rule)}
table.lines-t td{padding:9px 14px;border-bottom:1px solid var(--rule-2)}
table.lines-t tr:last-child td{border-bottom:none}
table.lines-t td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
  white-space:nowrap}
table.lines-t .pill{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;
  padding:2px 6px;border-radius:4px;background:var(--his-bg);color:var(--his-ink)}
</style>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow" id="period-label"></div>
    <h1 id="page-title"></h1>
    <p class="sub" id="page-sub"></p>
    <div id="sample-note" hidden class="sample-note"></div>
  </header>
</div>

<div class="settle">
  <div class="settle-inner">
    <div class="settle-figure">
      <div class="settle-amount" id="net">$0.00</div>
      <div class="settle-label" id="net-label"></div>
    </div>
    <div class="stat"><span class="stat-k">Shared</span><span class="stat-v" id="s-shared">$0.00</span></div>
    <div class="stat"><span class="stat-k">On his behalf</span><span class="stat-v" id="s-his">$0.00</span></div>
    <div class="stat"><span class="stat-k">Already paid</span><span class="stat-v" id="s-paid">$0.00</span></div>
    <div class="stat"><span class="stat-k">Undecided</span><span class="stat-v warn" id="s-review">0</span></div>
  </div>
</div>

<div class="wrap">
  <div class="toolbar">
    <div class="tabs" id="views"></div>
    <div class="months" id="months"></div>
    <span class="spacer"></span>
    <button class="btn" id="export-csv" type="button" hidden>Download ledger</button>
    <button class="btn primary" id="export-md" type="button" hidden>Download settlement</button>
  </div>
  <div id="main"></div>
  <footer id="foot"></footer>
</div>

<div class="saving" id="toast"></div>

<script type="application/json" id="ledger-data">__LEDGER_JSON__</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("ledger-data").textContent);
  var META = DATA.meta, MONTHS = DATA.months, SHARE = META.default_share;

  var view = "review", monthIx = MONTHS.length - 1, filter = "review";
  var db = null, downloads = null, dirty = {}, flushTimer = null;

  var SPLITS = [
    {key:"shared",   label:"Split",  cls:"v-shared"},
    {key:"personal", label:"Mine",   cls:"v-personal"},
    {key:"his",      label:"His",    cls:"v-his"},
    {key:"excluded", label:"Skip",   cls:"v-excluded"}
  ];

  // Every month's decisions live in one map; transaction ids are unique across months.
  var state = {};
  MONTHS.forEach(function(m){
    m.txns.forEach(function(t){ state[t.id] = {split: t.split}; });
  });

  function month(){ return MONTHS[monthIx]; }
  function money(n){
    var s = Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (n < 0 ? "−$" : "$") + s;
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function effectiveSplit(t){ return state[t.id].split; }

  // Shared lines are halved; a line you fronted for him he owes in full.
  function owed(t){
    if(t.is_payment) return 0;
    var sp = effectiveSplit(t);
    if(sp === "shared") return t.amount * SHARE;
    if(sp === "his") return t.amount;
    return 0;
  }

  function totals(){
    var o = {shared:0, his:0, owed:0, paid:0, review:0, reviewAmt:0,
             personal:0, excluded:0, cats:{}};
    month().txns.forEach(function(t){
      if(t.is_payment){ o.paid += -t.amount; return; }
      var sp = effectiveSplit(t);
      if(sp === "shared" || sp === "his"){
        if(sp === "shared") o.shared += t.amount; else o.his += t.amount;
        var due = owed(t);
        o.owed += due;
        var k = t.category || "Uncategorized";
        o.cats[k] = (o.cats[k] || 0) + due;
      }
      else if(sp === "personal") o.personal += t.amount;
      else if(sp === "review"){ o.review++; o.reviewAmt += t.amount; }
      else o.excluded += t.amount;
    });
    o.net = o.owed - o.paid;
    return o;
  }

  /* ---------------- shared chrome ---------------- */

  function renderHeader(o){
    document.getElementById("page-title").textContent = month().pretty;
    document.getElementById("period-label").textContent =
      META.me + " and " + META.partner + " · household split";
    document.getElementById("page-sub").textContent = view === "review"
      ? "Tick what belongs to both of you. The settlement updates as you go and your choices are saved."
      : "The finished settlement for this month. Every figure comes from the decisions on the Review tab.";
    document.getElementById("net").textContent = money(o.net);
    document.getElementById("net-label").textContent =
      META.partner + " owes " + META.me + (o.review ? ", so far" : "");
    document.getElementById("s-shared").textContent = money(o.shared);
    document.getElementById("s-his").textContent = money(o.his);
    document.getElementById("s-paid").textContent = "−" + money(o.paid);
    var rv = document.getElementById("s-review");
    rv.textContent = o.review ? String(o.review) : "none";
    rv.classList.toggle("warn", o.review > 0);
    document.getElementById("foot").textContent = META.footer;
  }

  function renderToolbar(){
    var views = document.getElementById("views");
    views.textContent = "";
    [["review","Review"],["settlement","Settlement"]].forEach(function(v){
      var b = el("button", null, v[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(view === v[0]));
      b.addEventListener("click", function(){ view = v[0]; render(); });
      views.appendChild(b);
    });

    var months = document.getElementById("months");
    months.textContent = "";
    if(MONTHS.length > 1){
      MONTHS.forEach(function(m, i){
        var b = el("button", null, m.pretty);
        b.type = "button";
        b.setAttribute("aria-pressed", String(monthIx === i));
        b.addEventListener("click", function(){ monthIx = i; render(); });
        months.appendChild(b);
      });
    }
  }

  /* ---------------- settlement view ---------------- */

  function renderSettlement(o){
    var main = document.getElementById("main");
    main.textContent = "";

    var grid = el("div", "settlement");

    var head = el("div", "headline");
    head.appendChild(el("div", "who", META.partner + " owes " + META.me));
    var amt = el("div", "amt" + (o.review ? "" : " settled"), money(o.net));
    head.appendChild(amt);
    if(o.review){
      head.appendChild(el("div", "cav",
        o.review + " transaction" + (o.review === 1 ? "" : "s") + " worth " +
        money(o.reviewAmt) + " still undecided, so this figure will move."));
    }

    var calc = el("table", "calc");
    function row(label, value, sub){
      var tr = el("tr", sub ? "sub" : null);
      tr.appendChild(el("td", null, label));
      tr.appendChild(el("td", null, value));
      calc.appendChild(tr);
    }
    row("Shared expenses", money(o.shared));
    row("His half of those", money(o.shared * SHARE), true);
    if(o.his){
      row("Paid on his behalf", money(o.his));
      row("He owes all of that", money(o.his), true);
    }
    row("Already paid back", "−" + money(o.paid));
    row("Net owed", money(o.net));
    head.appendChild(calc);
    grid.appendChild(head);

    var panel = el("div", "panel");
    panel.appendChild(el("h3", null, "What he owes, by category"));
    var cats = Object.keys(o.cats).map(function(k){ return [k, o.cats[k]]; })
      .filter(function(kv){ return kv[1] > 0; })
      .sort(function(a, b){ return b[1] - a[1]; });
    var max = cats.length ? cats[0][1] : 1;
    if(!cats.length){
      panel.appendChild(el("div", "cat", "Nothing classified as shared yet."));
    }
    cats.forEach(function(kv){
      var c = el("div", "cat");
      c.appendChild(el("span", "nm", kv[0]));
      var bar = el("span", "meter");
      var fill = el("i");
      fill.style.width = Math.max(3, (kv[1] / max) * 100) + "%";
      bar.appendChild(fill);
      c.appendChild(bar);
      c.appendChild(el("span", "vl", money(kv[1])));
      panel.appendChild(c);
    });
    grid.appendChild(panel);
    main.appendChild(grid);

    var lines = el("div", "lines");
    lines.appendChild(el("h3", null, "Every line he is charged for"));
    var wrap = el("div", "tablewrap");
    var t = el("table", "lines-t");
    var thead = el("thead");
    var htr = el("tr");
    ["Date", "Account", "Description", "Amount", "His share"].forEach(function(h, i){
      var th = el("th", i >= 3 ? "n" : null, h);
      if(i >= 3) th.style.textAlign = "right";
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    t.appendChild(thead);

    var tbody = el("tbody");
    var charged = month().txns.filter(function(x){
      var sp = effectiveSplit(x);
      return !x.is_payment && (sp === "shared" || sp === "his");
    });
    charged.sort(function(a, b){ return owed(b) - owed(a); });
    charged.forEach(function(x){
      var tr = el("tr");
      tr.appendChild(el("td", null, x.date.slice(5)));
      tr.appendChild(el("td", null, x.source));
      var d = el("td");
      d.appendChild(document.createTextNode(x.desc));
      if(effectiveSplit(x) === "his"){
        d.appendChild(document.createTextNode(" "));
        d.appendChild(el("span", "pill", "all his"));
      }
      tr.appendChild(d);
      tr.appendChild(el("td", "n", money(x.amount)));
      tr.appendChild(el("td", "n", money(owed(x))));
      tbody.appendChild(tr);
    });
    if(!charged.length){
      var tr = el("tr");
      var td = el("td", null, "Nothing to charge him for yet.");
      td.colSpan = 5;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    t.appendChild(tbody);
    wrap.appendChild(t);
    lines.appendChild(wrap);
    main.appendChild(lines);
  }

  /* ---------------- review view ---------------- */

  function counts(){
    var c = {all:month().txns.length, review:0, shared:0, his:0, personal:0, excluded:0};
    month().txns.forEach(function(t){
      var sp = t.is_payment ? "excluded" : effectiveSplit(t);
      if(c[sp] !== undefined) c[sp]++;
    });
    return c;
  }

  function renderReview(){
    var main = document.getElementById("main");
    main.textContent = "";

    var c = counts();
    var bar = el("div", "bar");
    [["review","Needs a decision"],["all","Everything"],["shared","Split"],
     ["his","His"],["personal","Mine"],["excluded","Skipped"]].forEach(function(d){
      var b = el("button", "chip");
      b.type = "button";
      b.setAttribute("aria-pressed", String(filter === d[0]));
      b.appendChild(document.createTextNode(d[1]));
      b.appendChild(el("span", "n", c[d[0]]));
      b.addEventListener("click", function(){ filter = d[0]; render(); });
      bar.appendChild(b);
    });
    bar.appendChild(el("span", "bar-sep"));
    var undecided = month().txns.filter(function(t){ return effectiveSplit(t) === "review"; });
    if(undecided.length){
      var all = el("button", "linkbtn", "Split all " + undecided.length + " undecided");
      all.type = "button";
      all.addEventListener("click", function(){
        undecided.forEach(function(t){ setSplit(t, "shared", true); });
        render(); flush();
      });
      bar.appendChild(all);
    }
    main.appendChild(bar);

    var rows = month().txns.filter(function(t){
      if(filter === "all") return true;
      var sp = t.is_payment ? "excluded" : effectiveSplit(t);
      return sp === filter;
    });

    if(!rows.length){
      main.appendChild(el("div", "empty", filter === "review"
        ? "Nothing left to decide this month. Open the Settlement tab for the finished figure."
        : "No transactions in this view."));
      return;
    }

    var order = [], groups = {};
    rows.forEach(function(t){
      if(!groups[t.account]){ groups[t.account] = []; order.push(t.account); }
      groups[t.account].push(t);
    });

    order.forEach(function(account){
      var head = el("div", "group-head");
      head.appendChild(el("h2", null, account));
      head.appendChild(el("span", "rule"));
      head.appendChild(el("span", "n", groups[account].length + " of " +
        month().txns.filter(function(t){ return t.account === account; }).length));
      main.appendChild(head);
      var box = el("div", "ledger");
      groups[account].forEach(function(t){ box.appendChild(rowEl(t)); });
      main.appendChild(box);
    });
  }

  function setSplit(t, value, quiet){
    state[t.id].split = value;
    dirty[t.id] = true;
    if(!quiet){ render(); flush(); }
  }

  function segment(current, onPick, compact){
    var seg = el("div", "seg" + (compact ? " compact" : ""));
    SPLITS.forEach(function(sp){
      var b = el("button", sp.cls);
      b.type = "button";
      b.setAttribute("aria-pressed", String(current === sp.key));
      if(!compact) b.appendChild(el("span", "tick", current === sp.key ? "✓" : ""));
      b.appendChild(document.createTextNode(sp.label));
      b.addEventListener("click", function(){ onPick(sp.key); });
      seg.appendChild(b);
    });
    return seg;
  }

  function rowEl(t){
    var sp = effectiveSplit(t);
    var row = el("div", "row" + (sp === "review" ? " is-review" : ""));
    row.appendChild(segment(sp, function(v){ setSplit(t, v); }, false));
    row.appendChild(el("div", "row-date", t.date.slice(5)));

    var main = el("div", "row-main");
    main.appendChild(el("div", "row-desc", t.desc));
    if(t.raw && t.raw !== t.desc) main.appendChild(el("div", "row-raw", t.raw));

    var meta = el("div", "row-meta");
    if(t.category) meta.appendChild(el("span", "tag", t.category));
    var reason = t.note || t.rule;
    if(reason) meta.appendChild(el("span", "tag rule", reason));
    if(meta.childNodes.length) main.appendChild(meta);
    row.appendChild(main);

    row.appendChild(el("div", "row-amt" + (t.amount < 0 ? " refund" : ""), money(t.amount)));

    var due = owed(t);
    var ow = el("div", "row-owed" + (due ? (sp === "his" ? " all-his" : " on") : ""));
    ow.textContent = t.is_payment ? "paid back"
      : (due ? money(due) + (sp === "his" ? " (all)" : "") : "—");
    row.appendChild(ow);

    return row;
  }

  /* ---------------- export ---------------- */

  function csvCell(v){
    var s = String(v === undefined || v === null ? "" : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function ledgerCsv(){
    var out = [["date","account","source","description","amount","split",
                "his_share","category","rule","note","raw_description"].join(",")];
    month().txns.forEach(function(t){
      out.push([t.date, t.account, t.source, t.desc, t.amount.toFixed(2),
        t.is_payment ? "payback" : effectiveSplit(t), owed(t).toFixed(2),
        t.category, t.rule, t.note, t.raw].map(csvCell).join(","));
    });
    return out.join("\n");
  }

  function settlementMd(){
    var o = totals();
    var L = [];
    L.push("# " + month().pretty + " — household split");
    L.push("");
    L.push("**" + META.partner + " owes " + META.me + ": " + money(o.net) + "**");
    L.push("");
    L.push("| | |");
    L.push("|---|---:|");
    L.push("| Shared expenses | " + money(o.shared) + " |");
    L.push("| His half of those | " + money(o.shared * SHARE) + " |");
    if(o.his) L.push("| Paid on his behalf (all his) | " + money(o.his) + " |");
    L.push("| Already paid back | −" + money(o.paid) + " |");
    L.push("| **Net owed** | **" + money(o.net) + "** |");
    L.push("");
    if(o.review){
      L.push("> " + o.review + " transactions worth " + money(o.reviewAmt) +
             " are still undecided and are not in this total.");
      L.push("");
    }
    L.push("## By category");
    L.push("");
    L.push("| Category | His share |");
    L.push("|---|---:|");
    Object.keys(o.cats).sort(function(a,b){ return o.cats[b]-o.cats[a]; }).forEach(function(k){
      if(o.cats[k] > 0) L.push("| " + k + " | " + money(o.cats[k]) + " |");
    });
    L.push("");
    L.push("## Every line");
    L.push("");
    L.push("| Date | Account | Description | Amount | His share |");
    L.push("|---|---|---|---:|---:|");
    month().txns.forEach(function(t){
      var sp = effectiveSplit(t);
      if(t.is_payment || (sp !== "shared" && sp !== "his")) return;
      L.push("| " + t.date + " | " + t.source + " | " + t.desc.replace(/\|/g, "/") +
             (sp === "his" ? " _(all his)_" : "") +
             " | " + money(t.amount) + " | " + money(owed(t)) + " |");
    });
    return L.join("\n") + "\n";
  }

  function wireExports(){
    var csvBtn = document.getElementById("export-csv");
    var mdBtn = document.getElementById("export-md");
    if(!downloads) return;           // no save affordance when it cannot save
    csvBtn.hidden = false;
    mdBtn.hidden = false;
    csvBtn.onclick = function(){ save("ledger-" + month().label + ".csv", ledgerCsv()); };
    mdBtn.onclick = function(){ save("settlement-" + month().label + ".md", settlementMd()); };
  }

  function save(filename, data){
    downloads.save({filename: filename, data: data}).then(function(){
      toast("Saved " + filename);
    }).catch(function(err){
      var code = err && err.code;
      if(code === "declined") return;                 // they said no; nothing to report
      if(code === "rate_limited") toast("A save prompt is already open", true);
      else toast("Could not save " + filename, true);
    });
  }

  /* ---------------- persistence ---------------- */

  function toast(msg, warn){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.toggle("warn", !!warn);
    t.classList.add("show");
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.classList.remove("show"); }, 1900);
  }

  function flush(){
    if(!db) return;
    clearTimeout(flushTimer);
    flushTimer = setTimeout(function(){
      var ids = Object.keys(dirty);
      if(!ids.length) return;
      dirty = {};
      Promise.all(ids.map(function(id){
        return db.doc("decisions/" + id).set({
          split: state[id].split,
          updatedAt: Date.now()
        });
      })).then(function(){
        toast("Saved " + ids.length + (ids.length === 1 ? " decision" : " decisions"));
      }).catch(function(){
        toast("Could not save — your choices are still on screen", true);
      });
    }, 400);
  }

  function render(){
    var o = totals();
    renderHeader(o);
    renderToolbar();
    if(view === "settlement") renderSettlement(o);
    else renderReview();
  }

  if(META.sample_note){
    var note = document.getElementById("sample-note");
    note.hidden = false;
    note.textContent = META.sample_note;
  }
  render();

  // Capabilities arrive later, if at all. The page is complete without them.
  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(handle){
      if(!handle) return;
      db = handle;
      db.collection("decisions").onSnapshot(function(snap){
        var changed = false;
        snap.docs.forEach(function(doc){
          var body = doc.data();
          if(!body || !state[doc.id] || dirty[doc.id]) return;
          state[doc.id].split = body.split || state[doc.id].split;
          changed = true;
        });
        if(changed) render();
      }, function(){ /* store unavailable; local decisions still stand */ });
    });
    window.claude.use("downloads").then(function(handle){
      downloads = handle;
      wireExports();
    });
  }
})();
</script>
