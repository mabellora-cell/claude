name = "baby items"
split = "shared"
category = "Baby"
match = ["diaper", "wipe\\w*", "formula", "bottle", "pacifier", "onesie", "swaddle",
         "stroller", "crib", "baby", "infant", "toddler", "nursing", "high ?chair",
         "bib\\w*", "teether", "sippy", "car seat", "bassinet", "burp", "sleepsack",
         "sleep and play", "bodysuit", "romper", "jumpsuit", "footed pajama",
         "little planet", "honestbaby", "gymboree", "carter", "pumping bra",
         "breast pump", "flange", "newborn", "hair bows", "walkie talkie"]

[[item_rule]]
name = "household items"
split = "shared"
category = "Home"
match = ["paper towel", "toilet paper", "detergent", "dish soap", "trash bag",
         "air filter", "light bulb", "batter\\w*", "cleaner", "vacuum", "storage",
         "sheet\\w*", "towel\\w*", "kitchen", "cookware", "pantry", "laundry",
         "molly's suds", "whitener", "dishwasher pod", "hand soap", "mrs. meyer",
         "insect trap", "curtain rod", "cable tie", "cord clip", "hanger\\w*",
         "snack container", "water test kit", "organizer bin", "shampoo & body wash"]

[[item_rule]]
name = "personal items"
split = "personal"
category = "Personal"
match = ["makeup", "lipstick", "serum", "moisturi\\w*", "perfume", "novel",
         "kindle", "jewelry", "handbag", "supplement\\w*", "vitamin\\w*",
         "vanicream", "nutrafol", "earring\\w*", "sunglasses", "tank top",
         "pajama short", "shower cap", "fanny pack", "wallet", "ruffle sock",
