# ---------------------------------------------------------------------------
# Splitting rules, written against your real July-August 2026 statements.
#
# Deliberately conservative: only merchants whose category is unambiguous are
# auto-classified. Anything that depends on knowing *why* you bought something
# is left for you to tick on the review page. Most specific match wins, so rule
# order in this file does not matter.
# ---------------------------------------------------------------------------

[household]
me = "Mabel"
partner = "Husband"                # <- tell me his name and I'll set it here
# Money he sends you. Netted off what he owes rather than counted as income.
partner_aliases = ["zelle payment from llc gemstonegod"]
default_share = 0.5


# ===========================================================================
# NOT EXPENSES — money moving between your own accounts, or income.
# These must never be counted: paying the Amex bill is not a new expense, the
# Amex charges themselves already are.
# ===========================================================================
[[rule]]
name = "income"
split = "excluded"
category = "Income"
match = ["king jesus inter des:payroll", "iaic des:claim pymt", "bofa rewards",
         "bkofamerica mobile", "des:payroll"]

[[rule]]
name = "card payments"
split = "excluded"
match = ["capital one des:online pmt", "capital one online pymt",
         "american express des:ach pmt", "online payment - thank you",
         "mobile payment - thank you"]

[[rule]]
name = "internal transfers"
split = "excluded"
match = ["keep the change transfer", "online banking transfer",
         "webull financial", "rh brokerage deposit"]

[[rule]]
name = "cash withdrawals"
split = "excluded"
category = "Cash"
match = ["branch banking", "pai atm", "atm withdrwl", "withdrwl"]
# Cash can't be attributed to a merchant. Excluded rather than guessed --
# add it back by hand if you know what a specific withdrawal paid for.


# ===========================================================================
# SHARED — household, baby, and the two of you.
# ===========================================================================
[[rule]]
name = "rent"
split = "shared"
category = "Rent"
match = ["cindy landlord"]

[[rule]]
name = "utilities"
split = "shared"
category = "Utilities"
match = ["fpl direct debit", "homestead utilit", "att des:payment",
         "paymentus des:billpay", "adt\\*", "vivint"]

[[rule]]
name = "fuel"
split = "shared"
category = "Car"
match = ["costco gas", "shell oil", "chevron", "wawa", "racetrac"]

[[rule]]
name = "groceries"
split = "shared"
category = "Groceries"
match = ["publix", "aldi", "costco", "instacart", "winn.?dixie", "sedanos", "fresco y mas"]

[[rule]]
name = "childcare"
split = "shared"
category = "Childcare"
match = ["baby ?sit\\w*", "weekly baby\\w*", "day ?care", "nanny"]

[[rule]]
name = "baby"
split = "shared"
category = "Baby"
match = ["bobbie", "hibobbie", "dreamland bab", "magnetic-me", "legendairy",
         "tonies", "pottery barn kids", "buy ?buy ?baby", "carter"]

[[rule]]
name = "pets"
split = "shared"
category = "Pets"
match = ["spot pet insurance", "town & country animal", "chewy", "petco", "petsmart"]

[[rule]]
name = "home"
split = "shared"
category = "Home"
match = ["home ?depot", "lowe's", "eufy", "landscaping", "ikea", "wayfair"]

[[rule]]
name = "family travel"
split = "shared"
category = "Travel"
match = ["wdw", "walt disney world", "disney mk", "jetblue", "boardwalk",
         "earl of sandwich", "lightning lane", "swanhotel"]

[[rule]]
name = "food delivery"
split = "shared"
category = "Dining"
match = ["uber ?eats", "doordash", "dd \\*", "grubhub", "postmates",
         "id:uber\\b", "uber \\*trip"]

[[rule]]
name = "shared subscriptions"
split = "shared"
category = "Subscriptions"
match = ["netflix", "disney plus", "hulu", "youtube ?tv", "google youtube"]


# ===========================================================================
# PERSONAL — yours alone.
# ===========================================================================
[[rule]]
name = "beauty and personal care"
split = "personal"
category = "Personal"
match = ["tania beauty", "beauty salon", "sephora", "ulta", "massage",
         "maria labrador", "nail", "jousfit"]

[[rule]]
name = "clothing and luxury"
split = "personal"
category = "Personal"
match = ["ferragamo", "salvatore fer", "macys", "lacoste", "temu", "stitchy fish",
         "box lunch", "sassy saints", "beis travel"]

[[rule]]
name = "student loan"
split = "personal"
category = "Debt"
match = ["dept education", "student ln"]

[[rule]]
name = "work and software"
split = "personal"
category = "Software"
match = ["anthropic", "canva", "dropbox", "tiktok", "kudos innov", "metaplatfor",
         "monarch money", "snapfish", "dbpr des", "apple.com bill",
         "google google", "adobe", "figma"]

[[rule]]
name = "tolls and parking"
split = "personal"
category = "Car"
match = ["sunpass", "villaverde parking", "mpa parking", "parking pay by phon",
         "brickell city cen"]


# ===========================================================================
# AMAZON ITEM RULES — matched against product names from the Amazon export.
# Without that export every Amazon charge falls through to review.
# ===========================================================================
